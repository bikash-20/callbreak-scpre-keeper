<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#242538" />
      <stop offset="50%" stop-color="#171822" />
      <stop offset="100%" stop-color="#0d0e15" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#e0b558" />
      <stop offset="100%" stop-color="#b8941f" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#7c5ce7" />
      <stop offset="100%" stop-color="#583bb3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#41405a" stroke-width="4" />

  <!-- Subtle inner border -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Golden Ace / Spade Trump Symbol -->
  <g filter="url(#glow)">
    <!-- Spade base shadow -->
    <path d="M 256 95 C 256 95 120 225 120 310 C 120 370 170 405 224 405 C 244 405 252 395 256 385 C 260 395 268 405 288 405 C 342 405 392 370 392 310 C 392 225 256 95 256 95 Z" fill="url(#purpleGrad)" />
    <!-- Spade stem -->
    <path d="M 242 360 C 242 380 215 415 210 425 L 302 425 C 297 415 270 380 270 360 Z" fill="url(#purpleGrad)" />
  </g>

  <!-- Inner Spade Accent -->
  <path d="M 256 130 C 256 130 152 235 152 305 C 152 350 190 380 230 380 C 246 380 252 372 256 364 C 260 372 266 380 282 380 C 322 380 360 350 360 305 C 360 235 256 130 256 130 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.85" />

  <!-- Golden Crown over Spade -->
  <g id="crown">
    <path d="M 195 210 L 218 245 L 256 195 L 294 245 L 317 210 L 308 270 L 204 270 Z" fill="url(#goldGrad)" />
    <circle cx="195" cy="205" r="5" fill="#fff" />
    <circle cx="256" cy="190" r="6" fill="#fff" />
    <circle cx="317" cy="205" r="5" fill="#fff" />
    <rect x="204" y="265" width="104" height="8" rx="4" fill="#fff" opacity="0.4" />
  </g>

  <!-- Card Suits in Corners -->
  <text x="68" y="92" font-family="sans-serif" font-size="36" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">♠</text>
  <text x="444" y="92" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ee7b74" text-anchor="middle">♥</text>
  <text x="68" y="445" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ee7b74" text-anchor="middle">♦</text>
  <text x="444" y="445" font-family="sans-serif" font-size="36" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">♣</text>
</svg>